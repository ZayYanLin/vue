<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<style>
    .box {
        padding: 100px;
        color: black;
        background-color: skyblue;
        margin: 20px;
        display: inline-block;                                                                                                                                                              
    }
    li {
        list-style: none;
        margin: 10px;
        padding: 10px;
    }
    .favorite {
        background-color: rgb(74, 123, 152);
    }
</style>
<body>
    <h1>Vue learning</h1>
    <div id="app">
        <div v-if="showbook">
            <ul v-for="info in filteredInfo" :key="info.name">
                <li :class="{ favorite: info.isfav }" @click="info.isfav = !info.isfav">
                    <img :src="info.img" :alt="info.name" width="300" height="200">
                    <h1>Name: {{ info.name }}</h1>
                    <h2>Age: {{ info.age }}</h2>
                    <h3>City: {{ info.city }}</h3>
                    <a v-bind:href="link" target="_blank">Visit Google</a><hr>
                </li>
            </ul>
        </div>
        <button @click="showbook=!showbook">
            <span v-if="showbook">hidebook</span>
            <span v-if="!showbook">showbook</span>
        </button>
        <br><br>
        <div class="box" @mouseover="overHandler($event, 'dataHover')">Hover</div>
        <div class="box" @mouseout="outHandler($event, 'dataOut')">MouseOut</div>
        <div class="box" @dblclick="doubleHandler($event, 'dataDouble')">Doubleclick</div>
    </div>
</body>
    <script src="app.js"></script>
</html>
